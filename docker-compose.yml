services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: geomeasure
      POSTGRES_PASSWORD: geomeasure
      POSTGRES_DB: geomeasure
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geomeasure"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://geomeasure:geomeasure@db:5432/geomeasure
      UPLOAD_DIR: /app/storage/uploads
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - uploads:/app/storage/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
